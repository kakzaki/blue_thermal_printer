name: blue_thermal_printer
description: A Flutter plugin for connecting to thermal printer via bluetooth, updated for modern Flutter SDKs.
version: 1.3.4
homepage: https://github.com/hudy-79/blue_thermal_printer.git
repository: https://github.com/hudy-79/blue_thermal_printer.git

environment:
  sdk: '>=3.0.0 <4.0.0'          
  flutter: '>=3.19.0'          

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0         

flutter:
  plugin:
    platforms:
      android:
        package: id.kakzaki.blue_thermal_printer
        pluginClass: BlueThermalPrinterPlugin
      ios:
        pluginClass: BlueThermalPrinterPlugin
      macos:
        pluginClass: BlueThermalPrinterPlugin
